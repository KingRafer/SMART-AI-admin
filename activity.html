<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Log — Smart AI Admin</title>
  <meta name="theme-color" content="#070b14">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <script src="js/theme-init.js"></script>
  <script src="js/guard.js"></script>
</head>
<body>
  <div class="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark"><i data-icon="zap"></i></span>
        <div><strong>SMART<span>AI</span></strong><small>Admin Panel</small></div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">Overview</div>
        <a class="nav-item" href="dashboard.html"><i data-icon="layout-dashboard"></i>Dashboard</a>
        <a class="nav-item active" href="activity.html"><i data-icon="clipboard-list"></i>Activity Log</a>
        <div class="nav-section">Manajemen</div>
        <a class="nav-item" href="members.html"><i data-icon="users"></i>Members<span class="nav-badge" id="nav-pending" hidden></span></a>
        <a class="nav-item" href="accounts.html"><i data-icon="trending-up"></i>Trading Accounts</a>
        <a class="nav-item" href="commissions.html"><i data-icon="wallet"></i>Commissions</a>
        <a class="nav-item" href="referrals.html"><i data-icon="share"></i>Referrals</a>
        <div class="nav-section">Sistem</div>
        <a class="nav-item" href="settings.html"><i data-icon="sliders"></i>Settings</a>
      </nav>
      <div class="sidebar-foot">
        <div class="admin-chip">
          <div class="av" data-admin-initials>A</div>
          <div><b data-admin-name>Admin</b><span data-admin-role>admin</span></div>
        </div>
        <button type="button" class="nav-item" data-logout><i data-icon="log-out"></i>Logout</button>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="backdrop"></div>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button type="button" class="icon-btn" id="menu-btn" aria-label="Menu"><i data-icon="menu"></i></button>
        <div class="topbar-title">
          <h1>Activity Log</h1>
          <p>Riwayat aktivitas sistem</p>
        </div>
        <div class="topbar-actions">
          <button type="button" class="icon-btn" data-theme-toggle aria-label="Toggle theme"><i data-icon="moon"></i></button>
        </div>
      </header>

      <div class="page" id="page-activity">
        <div class="toolbar">
          <div class="search-box">
            <i data-icon="search"></i>
            <input type="search" id="act-search" placeholder="Cari aktivitas..." autocomplete="off">
          </div>
        </div>

        <div class="table-card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Waktu</th>
                  <th>Aktor</th>
                  <th>Aksi</th>
                  <th>Detail</th>
                </tr>
              </thead>
              <tbody id="act-tbody"></tbody>
            </table>
          </div>
          <div class="table-empty" id="act-empty" hidden>Belum ada aktivitas.</div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/auth-admin.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/pages/activity.js"></script>
</body>
</html>
